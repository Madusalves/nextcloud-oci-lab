# Nextcloud + PostgreSQL + Redis + cron, com primary storage num S3 LOCAL (RustFS).
# Variaveis vem de local-rustfs/.env (copie de ../.env.example).
#
# A parte do Nextcloud (x-nextcloud-env, db, redis, app, cron) e IDENTICA a
# ../oci-bucket/docker-compose.yml. A diferenca esta so em:
#   - name: (outro projeto => outros volumes; as instalacoes nunca se misturam)
#   - servicos rustfs + rustfs-init, que fazem o papel do OCI Object Storage
#
# ${VAR:?msg} => o compose aborta com "msg" se VAR nao estiver definida.

# Nome do projeto: prefixa volumes/redes (nextcloud-local_db, nextcloud-local_nextcloud...).
name: nextcloud-local

# -----------------------------------------------------------------------------
# Bloco de ambiente compartilhado entre "app" e "cron".
# Chaves "x-" sao ignoradas pelo compose; servem para reaproveitar YAML.
# &nextcloud-env cria a ancora; *nextcloud-env reutiliza o bloco.
#
# O cron PRECISA do mesmo ambiente que o app: os arquivos redis.config.php e
# s3.config.php da imagem leem getenv() a cada execucao do PHP.
# -----------------------------------------------------------------------------
x-nextcloud-env: &nextcloud-env
  # --- Instalacao automatica ---------------------------------------------
  NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?defina NEXTCLOUD_ADMIN_USER no .env}
  NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?defina NEXTCLOUD_ADMIN_PASSWORD no .env}
  NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}

  # --- Banco (todas as 4 obrigatorias, senao cai em SQLite) ------------
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # --- Redis: memcache.distributed + memcache.locking + sessoes PHP ----
  REDIS_HOST: redis
  REDIS_HOST_PASSWORD: ${REDIS_HOST_PASSWORD:?defina REDIS_HOST_PASSWORD no .env}

  # --- Primary storage S3 ------------------------------------------------
  OBJECTSTORE_S3_HOST: ${OBJECTSTORE_S3_HOST:?defina OBJECTSTORE_S3_HOST no .env}
  OBJECTSTORE_S3_PORT: ${OBJECTSTORE_S3_PORT:-443}
  OBJECTSTORE_S3_SSL: ${OBJECTSTORE_S3_SSL:-true}
  OBJECTSTORE_S3_REGION: ${OBJECTSTORE_S3_REGION:?defina OBJECTSTORE_S3_REGION no .env}
  OBJECTSTORE_S3_BUCKET: ${OBJECTSTORE_S3_BUCKET:?defina OBJECTSTORE_S3_BUCKET no .env}
  OBJECTSTORE_S3_USEPATH_STYLE: ${OBJECTSTORE_S3_USEPATH_STYLE:-true}
  OBJECTSTORE_S3_AUTOCREATE: ${OBJECTSTORE_S3_AUTOCREATE:-false}
  OBJECTSTORE_S3_KEY: ${OBJECTSTORE_S3_KEY:?defina OBJECTSTORE_S3_KEY no .env}
  OBJECTSTORE_S3_SECRET: ${OBJECTSTORE_S3_SECRET:?defina OBJECTSTORE_S3_SECRET no .env}

services:
  # ===========================================================================
  # S3 local — faz o papel do OCI Object Storage
  # ===========================================================================
  rustfs:
    # Versao EXATA: o RustFS lanca versoes quase toda semana e nao publica
    # tag por versao principal. Tem build arm64 e amd64.
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      # Credencial "root" do RustFS = a mesma que o Nextcloud usa para acessar.
      # Equivale a Customer Secret Key da OCI, so que aqui voce mesma define.
      RUSTFS_ACCESS_KEY: ${OBJECTSTORE_S3_KEY:?defina OBJECTSTORE_S3_KEY no .env}
      RUSTFS_SECRET_KEY: ${OBJECTSTORE_S3_SECRET:?defina OBJECTSTORE_S3_SECRET no .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000            # API S3
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001    # console web
    volumes:
      # Volume nomeado: nao precisa de chown (o container roda como UID 10001).
      - rustfs-data:/data
    ports:
      # So o console e publicado, e so em 127.0.0.1 (nao fica acessivel na rede).
      # A API S3 (9000) fica apenas na rede interna do compose.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rustfs-init:
    # Container one-shot: cria o bucket (se ainda nao existir) e termina.
    # Assim o bucket ja existe quando o Nextcloud sobe — igual na OCI —
    # e OBJECTSTORE_S3_AUTOCREATE=false vale para os dois ambientes.
    image: amazon/aws-cli:2.41.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECTSTORE_S3_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECTSTORE_S3_SECRET}
      AWS_DEFAULT_REGION: ${OBJECTSTORE_S3_REGION}
      S3_ENDPOINT: http://${OBJECTSTORE_S3_HOST}:${OBJECTSTORE_S3_PORT}
      S3_BUCKET: ${OBJECTSTORE_S3_BUCKET}
    entrypoint: ["sh", "-c"]
    # $$ = "$" literal: as variaveis sao resolvidas pelo shell DENTRO do container.
    # head-bucket || create-bucket => idempotente (pode rodar quantas vezes quiser).
    command:
      - |
        if aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          echo "bucket $$S3_BUCKET ja existe"
        else
          aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET" > /dev/null
          echo "bucket $$S3_BUCKET criado"
        fi
    restart: "no"

  # ===========================================================================
  # Nextcloud — identico ao setup da OCI (exceto depends_on do rustfs-init)
  # ===========================================================================
  db:
    # Versao principal fixa. 18 e a recomendada para o Nextcloud 35.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # Postgres 18+: o volume e montado em /var/lib/postgresql (nao mais em .../data).
      - db:/var/lib/postgresql
    healthcheck:
      # $$ = "$" literal; a variavel e resolvida pelo shell DENTRO do container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Versao principal fixa; tem build arm64 (VM Ampere da OCI).
    image: redis:8-alpine
    restart: unless-stopped
    # --requirepass: exige senha mesmo na rede interna (defesa em profundidade).
    # --save "" e --appendonly no: cache puro, sem gravar em disco. Tudo que fica
    # aqui (cache, locks, sessoes) pode ser reconstruido; por isso nao ha volume.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_HOST_PASSWORD:?defina REDIS_HOST_PASSWORD no .env}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      # O redis-cli le REDISCLI_AUTH sozinho: healthcheck e testes sem a senha no comando.
      REDISCLI_AUTH: ${REDIS_HOST_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": acessivel apenas pela rede interna do compose.

  app:
    # Versao principal fixa: o Nextcloud so atualiza uma versao principal por vez.
    image: nextcloud:35-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # So sobe depois que o bucket existir (rustfs-init terminou com exit 0).
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${NEXTCLOUD_HTTP_PORT:-8080}:80"
    volumes:
      # Codigo, config/config.php e o diretorio data (ainda usado para logs,
      # cache etc., mesmo com object storage).
      - nextcloud:/var/www/html
    environment: *nextcloud-env

  cron:
    # MESMA imagem do app; so troca o processo principal: em vez do Apache,
    # o /cron.sh roda "busybox crond", que executa a crontab do www-data:
    #   */5 * * * * php -f /var/www/html/cron.php
    image: nextcloud:35-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Espera o app iniciar (e fazer instalacao/upgrade) antes do primeiro cron.
      app:
        condition: service_started
    volumes:
      # Tem que ser o MESMO volume do app: o cron.php roda esse codigo e config.
      - nextcloud:/var/www/html
    environment: *nextcloud-env

volumes:
  db:
  nextcloud:
  rustfs-data:
